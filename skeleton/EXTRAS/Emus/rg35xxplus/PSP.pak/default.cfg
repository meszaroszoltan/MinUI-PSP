minarch_cpu_speed = Performance
-minarch_thread_video = Off

ppsspp_internal_resolution = 480x272
ppsspp_frameskip = disabled
ppsspp_auto_frameskip = disabled
ppsspp_fast_memory = enabled
ppsspp_cpu_core = JIT
ppsspp_texture_scaling_level = disabled
ppsspp_button_preference = Cross
-ppsspp_software_rendering = disabled
-ppsspp_backend = auto
-ppsspp_detect_vsync_swap_interval = disabled

bind D-Pad Up = UP
bind D-Pad Down = DOWN
bind D-Pad Left = LEFT
bind D-Pad Right = RIGHT
bind Select = SELECT
bind Start = START
bind Circle = A
bind Cross = B
bind Triangle = X
bind Square = Y
bind L = L1
bind R = R1
